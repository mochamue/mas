<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR-RAZZI Polaroid Denim Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
body{background:#0f1a2b;color:#e8eefc;font-family:system-ui,sans-serif}
.btn{background:#4a6fa5;color:#fff;padding:.6rem 1rem;border-radius:.6rem;font-weight:700;font-size:.85rem}
.btn:active{transform:scale(.96)}
.btn.alt{background:#1f2f4a;border:1px solid #4a6fa5}
canvas:fullscreen{width:100vw;height:100vh;max-height:none;object-fit:contain;background:#000}
.dot{width:10px;height:10px;border-radius:50%;background:#4a6fa5;opacity:.35;cursor:pointer}
.dot.on{opacity:1;transform:scale(1.5);background:#fff}
.dot.done{opacity:1}
</style>
</head>
<body class="p-3 max-w-3xl mx-auto">
<h1 id="hd" class="text-center font-extrabold text-sm sm:text-lg tracking-wide mb-3">AR-RAZZI POLAROID DENIM EDITOR - 30PIC x 1S + SOUND</h1>

<div class="flex flex-wrap gap-2 justify-center mb-3">
  <label class="btn cursor-pointer">PILIH 30 GAMBAR<input id="files" type="file" accept="image/*" multiple hidden></label>
  <button id="play" class="btn alt">▶ PLAY</button>
  <button id="export" class="btn">EXPORT VIDEO</button>
  <button id="fs" class="btn alt">⛶ SKRIN PENUH</button>
</div>

<div class="mb-3">
  <canvas id="cv" width="1920" height="1080" class="w-full" style="aspect-ratio:16/9;max-height:78vh;background:#e8dfcf"></canvas>
</div>
<div id="status" class="text-center text-xs text-sky-300 mb-2">Pic 1/30 - 00:00 · Sedia</div>
<div id="tl" class="flex flex-wrap gap-1 justify-center mb-4"></div>

<div class="bg-slate-800/60 rounded-xl p-3 mb-4 text-sm space-y-2">
  <div class="flex flex-wrap gap-4">
    <label><input id="sfxOn" type="checkbox" checked> Kesan Bunyi</label>
    <label><input id="musOn" type="checkbox" checked> Muzik Latar</label>
  </div>
  <div class="flex flex-wrap gap-2 items-center">
    <select id="track" class="bg-slate-900 rounded p-1">
      <option value="upbeat" selected>Beat Rancak &amp; Harmoni (120 BPM, 1 pic = 2 beat)</option>
      <option value="lofi">Lo-fi Chill Aesthetic (kenangan)</option>
      <option value="piano">Piano Soft Memories (sentimental)</option>
      <option value="custom" disabled>MP3 sendiri</option>
    </select>
    <label class="btn alt cursor-pointer">Upload MP3<input id="mp3" type="file" accept="audio/*" hidden></label>
  </div>
  <label class="flex items-center gap-2">Teks bawah bingkai <input id="foot" value="@AR-RAZZI 2026" maxlength="40" class="flex-1 bg-slate-900 rounded p-1"></label>
  <label class="flex items-center gap-2">Volume muzik <input id="vol" type="range" min="0" max="100" value="40" class="flex-1"></label>
</div>

<p class="text-xs text-slate-300 mb-1">✏️ Taip nama pada setiap gambar di bawah — ia keluar pada bingkai atas. Kosongkan untuk guna "Pic x/30".</p>
<div id="grid" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-6"></div>
<p class="text-center text-[11px] text-slate-400 mb-6">Bunyi dijana terus oleh Web Audio API (tiada fail luar) dan turut dirakam ke dalam video.</p>

/* ---------- LUKIS ---------- */
const rnd=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x)};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function polaroid(img,i,cx,cy,rot,sc,alpha){
  const FS=920,FH=FS*739/736,fx=-FS/2,fy=-FH/2;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);ctx.rotate(rot*Math.PI/180);ctx.scale(sc,sc);
  const x=fx+FS*.167,y=fy+FH*.170,w=FS*.662,h=FH*.662,iw=img.width,ih=img.height,r=w/h;
  let sw=iw,sh=iw/r;if(sh>ih){sh=ih;sw=ih*r}
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=40;ctx.shadowOffsetY=14;
  ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);
  ctx.drawImage(frameImg,fx,fy,FS,FH);ctx.shadowColor='transparent';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,20,60,.8)';ctx.shadowBlur=6;
  const fit=(t,y)=>{let f=34;do{ctx.font=`bold ${f}px system-ui,sans-serif`;f-=2}while(ctx.measureText(t).width>FS*.66&&f>14);ctx.fillText(t,0,y)};
  fit(names[i]||`Pic ${i+1}/${N} - ${fmt(i*SEC)}`,fy+FH*.12);fit(footer,fy+FH*.897);
  ctx.restore();
}
function draw(t){
  const i=Math.min(N-1,Math.floor(t/SEC)),local=t-i*SEC;
  const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#f1ebe0');bg.addColorStop(1,'#ddd0bb');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  const cx=W/2,cy=H/2;
  for(let j=Math.max(0,i-3);j<i;j++)
    polaroid(imgs[j],j,cx+(rnd(j,2)-.5)*340,cy+(rnd(j,3)-.5)*70,-15+25*rnd(j,1),1,1);
  const p=Math.min(local/.4,1),q=p-1,c1=1.70158,e=1+(c1+1)*q*q*q+c1*q*q;
  polaroid(imgs[i],i,cx,cy,-20+20*e,.7+.3*e,Math.min(1,p*3));
  if(local<.15){ctx.fillStyle=`rgba(255,255,255,${.75*(1-local/.15)})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

/* ---------- AUDIO ---------- */
let ac,master,sfx,mus,dest,nbuf,customBuf=null,customSrc=null;
function initAudio(){
  if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();
  dest=ac.createMediaStreamDestination();master=ac.createGain();master.connect(ac.destination);master.connect(dest);
  sfx=ac.createGain();sfx.connect(master);mus=ac.createGain();mus.connect(master);setVol();
  nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const setVol=()=>{if(mus)mus.gain.value=$('vol').value/100*.6};
function noise(t,dur,type,f0,f1,v,q=1,out=sfx){
  const s=ac.createBufferSource();s.buffer=nbuf;const f=ac.createBiquadFilter(),g=ac.createGain();
  f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+dur+.02);
}
function tone(t,dur,type,f0,f1,v,out=sfx){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);
}
function picSound(){ /* shutter + whoosh dalam 0.2s + soft pop (flash) */
  const t=ac.currentTime;
  noise(t,.035,'highpass',3000,2000,.9);tone(t,.03,'square',1800,900,.15);
  noise(t+.055,.05,'highpass',1500,900,.6);tone(t+.055,.05,'square',900,500,.12);
  noise(t+.02,.18,'bandpass',500,2800,.5,.8);
  const pg=ac.createGain();pg.gain.value=.5;pg.connect(master);
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(140,t+.12);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(pg);o.start(t);o.stop(t+.16);
  if(musPlaying){const v=$('vol').value/100*.6;mus.gain.cancelScheduledValues(t);mus.gain.setTargetAtTime(v*.6,t,.02);mus.gain.setTargetAtTime(v,t+.22,.1);}
}
function projector(){
  const t=ac.currentTime,o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain(),f=ac.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=55;f.type='lowpass';f.frequency.value=350;
  l.frequency.value=24;lg.gain.value=.12;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.25,t+.15);g.gain.linearRampToValueAtTime(.001,t+1);
  l.connect(lg);lg.connect(g.gain);o.connect(f);f.connect(g);g.connect(sfx);o.start(t);l.start(t);o.stop(t+1.05);l.stop(t+1.05);
  for(let k=0;k<24;k++)noise(t+k/24,.02,'bandpass',2500,2000,.12);
}
function eject(){
  const t=ac.currentTime;tone(t,.6,'sawtooth',180,650,.12);noise(t,.6,'bandpass',800,2200,.25,2);
  noise(t+.6,.04,'highpass',2500,1800,.5);
}
/* muzik latar dijana */
const TR={
 lofi:{bpm:76,ch:[[57,60,64,67],[53,57,60,64],[55,59,62,65],[52,55,59,62]],w:'triangle',lp:1100,pad:1},
 upbeat:{bpm:120,ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],w:'square',lp:2800,drums:1},
 piano:{bpm:66,ch:[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]],w:'sine',lp:3000}};
let mTimer=null,musPlaying=false;
function note(m,t,d,w,lp,v){
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type=w;o.frequency.value=440*2**((m-69)/12);
  f.type='lowpass';f.frequency.value=lp;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(f);f.connect(g);g.connect(mus);o.start(t);o.stop(t+d+.05);
}
function startMusic(){
  stopMusic();musPlaying=true;setVol();const sel=$('track').value;
  if(sel==='custom'&&customBuf){customSrc=ac.createBufferSource();customSrc.buffer=customBuf;customSrc.loop=true;customSrc.connect(mus);customSrc.start();return}
  const T=TR[sel==='custom'?'lofi':sel],beat=60/T.bpm,h=beat/2;
  let next=t0,step=0;if(playing){const el=Math.max(0,ac.currentTime-t0),k=Math.ceil(el/h);next=t0+k*h;step=k}
  const tick=()=>{while(next<ac.currentTime+.3){
    const c=T.ch[Math.floor(step/8)%4],s=step%8;
    if(T.pad){if(s%4===0)c.forEach(n=>note(n,next,beat*2,T.w,T.lp,.12));if(s%2===0)note(c[0]-24,next,beat*.9,'sine',400,.28);}
    else{note(c[s%c.length]+(s>=4?12:0),next,beat*.9,T.w,T.lp,.13);if(s%2===0)note(c[0]-24,next,beat*.5,'sine',300,.3);
      if(T.drums){if(s%2===0)kick(next);if(s===2||s===6)snare(next);hat(next,s%2);if(s%4===0)c.forEach(n=>note(n,next,beat*.8,'triangle',2400,.09));}}
    next+=beat/2;step++;}};
  tick();mTimer=setInterval(tick,100);
}
function kick(t){tone(t,.16,'sine',160,45,1,mus);noise(t,.01,'highpass',3000,2000,.2,1,mus)}
function snare(t){noise(t,.14,'bandpass',1900,1500,.7,.7,mus);tone(t,.08,'triangle',220,140,.35,mus)}
function hat(t,o){noise(t,o?.05:.03,'highpass',7500,7000,o?.35:.18,1,mus)}
function stopMusic(){musPlaying=false;clearInterval(mTimer);if(customSrc){try{customSrc.stop()}catch(e){}customSrc=null}}

/* ---------- PLAYBACK & EXPORT ---------- */
let playing=false,t0=0,last=-1,ejected=false,rec=null,chunks=[],mime='';
function play(record){
  if(playing)return;initAudio();ac.resume();playing=true;last=-1;ejected=false;t0=ac.currentTime+.05;
  $('play').textContent='■ STOP';
  if($('sfxOn').checked)projector();
  if($('musOn').checked)startMusic();
  if(record)startRec();
  requestAnimationFrame(loop);
}
function loop(){
  if(!playing)return;const el=ac.currentTime-t0;
  if(el<0){requestAnimationFrame(loop);return}
  if(el>=DUR){draw(DUR-.01);stop();return}
  const i=Math.floor(el/SEC);
  if(i!==last){last=i;if($('sfxOn').checked)picSound();mark(i)}
  if(!ejected&&el>=DUR-.7){ejected=true;if($('sfxOn').checked)eject()}
  draw(el);requestAnimationFrame(loop);
}
function stop(){
  const wasRec=!!rec;playing=false;stopMusic();$('play').textContent='▶ PLAY';
  if(rec){setTimeout(()=>{rec.stop()},800)} /* ekor bunyi eject */
}
function startRec(){
  const cs=cv.captureStream(30),at=dest.stream.getAudioTracks()[0];if(at)cs.addTrack(at);
  mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  chunks=[];rec=new MediaRecorder(cs,{mimeType:mime,videoBitsPerSecond:10e6});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const b=new Blob(chunks,{type:mime||'video/webm'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='ar-razzi-polaroid-denim.'+(mime.includes('mp4')?'mp4':'webm');a.click();
    rec=null;$('status').textContent='Siap! Video dimuat turun ('+(mime.includes('mp4')?'MP4':'WebM — pelayar anda tiada sokongan MP4')+')';};
  rec.start();$('status').textContent='Merakam 30 saat… jangan tutup tab';
}
function mark(i){
  $('status').textContent=`Pic ${i+1}/${N} - ${fmt(i*SEC)} · @AR-RAZZI 2026`;
  [...$('tl').children].forEach((d,k)=>d.className='dot'+(k<i?' done':'')+(k===i?' on':''));
}

/* ---------- UI ---------- */
function buildUI(srcs){
  const tl=$('tl'),gr=$('grid');tl.innerHTML='';gr.innerHTML='';
  srcs.forEach((s,i)=>{
    const d=document.createElement('div');d.className='dot';d.onclick=()=>{if(playing)return;mark(i);draw(i*SEC+.6)};tl.appendChild(d);
    const cell=document.createElement('div');cell.className='flex flex-col gap-1';
    const im=document.createElement('img');im.src=s;im.className='aspect-square object-cover rounded';
    const inp=document.createElement('input');inp.value=names[i]||'';inp.placeholder='Pic '+(i+1);inp.maxLength=40;
    inp.className='w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs';
    inp.onfocus=()=>{if(!playing){mark(i);draw(i*SEC+.6)}};
    inp.oninput=()=>{names[i]=inp.value;if(!playing)draw(i*SEC+.6)};
    cell.append(im,inp);gr.appendChild(cell);
  });
  gsap.from('#grid img',{scale:.5,opacity:0,stagger:.02,duration:.4});
}
function placeholders(){
  const urls=[];imgs=[];
  for(let i=0;i<N;i++){
    const c=document.createElement('canvas');c.width=c.height=600;const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,600,600);gr.addColorStop(0,`hsl(${i*14},70%,60%)`);gr.addColorStop(1,`hsl(${i*14+50},70%,40%)`);
    g.fillStyle=gr;g.fillRect(0,0,600,600);g.fillStyle='rgba(255,255,255,.85)';g.font='bold 220px system-ui';g.textAlign='center';g.fillText(i+1,300,380);
    imgs.push(c);urls.push(c.toDataURL('image/jpeg',.6));
  }
  names=[];buildUI(urls);mark(0);draw(.6);
}
$('files').onchange=async e=>{
  const f=[...e.target.files];if(!f.length)return;
  const arr=[];for(let i=0;i<N;i++)arr.push(f[i%f.length]);
  const cache=new Map();
  imgs=await Promise.all(arr.map(async x=>{if(!cache.has(x))cache.set(x,createImageBitmap(x));return cache.get(x)}));
  names=arr.map(x=>x.name.replace(/\.[^.]+$/,''));buildUI(arr.map(x=>URL.createObjectURL(x)));mark(0);draw(.6);
  $('status').textContent=f.length+' gambar dipilih'+(f.length<N?' (diulang hingga 30)':f.length>N?' (30 pertama digunakan)':'');
};
$('mp3').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;initAudio();
  customBuf=await ac.decodeAudioData(await f.arrayBuffer());
  const o=$('track').querySelector('[value=custom]');o.disabled=false;o.textContent='MP3: '+f.name;$('track').value='custom';
  if(playing&&$('musOn').checked)startMusic();
};
$('fs').onclick=()=>{if(cv.requestFullscreen)cv.requestFullscreen()};
$('vol').oninput=setVol;
$('foot').oninput=e=>{footer=e.target.value;if(!playing)draw(.6)};
$('track').onchange=()=>{if(playing&&$('musOn').checked)startMusic()};
$('musOn').onchange=e=>{if(playing){e.target.checked?startMusic():stopMusic()}};
$('play').onclick=()=>playing?stop():play(false);
$('export').onclick=()=>{if(typeof MediaRecorder==='undefined'){alert('Pelayar tidak menyokong MediaRecorder');return}if(!playing)play(true)};
gsap.from('#hd',{y:-20,opacity:0,duration:.6});
placeholders();
</script>
