const bok=Array.from({length:38},()=>({x:rnd()*W,y:rnd()*H,r:7+rnd()*30,vy:5+rnd()*14,sp:.4+rnd()*1.1,ph:rnd()*6.28,am:10+rnd()*30,al:.18+rnd()*.35}));
const spk=Array.from({length:70},()=>({x:rnd()*W,y:rnd()*H,r:.8+rnd()*1.8,sp:1+rnd()*3,ph:rnd()*6.28,vy:2+rnd()*6}));
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const FONT="'Bebas Neue','Oswald','Anton','Arial Narrow','Impact',sans-serif";
const LAMPS=[[273,57,16],[790,17,22],[745,143,22],[1262,238,22],[723,488,14],[687,555,14],[783,662,16],[958,647,15]];
const wv=x=>Math.max(ss(630,860,x),1-ss(0,50,x));
const dyOf=(x,t,w)=>w*(8*Math.sin(x*.011+t*1.5)+4.5*Math.sin(x*.026-t*2.2)+2.2*Math.sin(x*.05+t*3));
function draw(c,S,t){
c.setTransform(S,0,0,S,0,0);c.globalAlpha=1;c.fillStyle='#fff';c.fillRect(0,0,W,H);
c.drawImage(bgc,0,0);
for(let x=0;x<W;x+=4){const w=wv(x);if(w<=0)continue;const dy=dyOf(x,t,w);
c.drawImage(bgc,x,0,4,H,x,dy,4,H);
const a=w*.10*(1+Math.sin(x*.014-t*1.8)*Math.sin(t*.7+x*.003));
c.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';c.fillRect(x,0,4,H);}
LAMPS.forEach((l,i)=>{const x=l[0],y=l[1]+dyOf(l[0],t,wv(l[0])),p=.5+.5*Math.sin(t*2.1+i*1.3),r=l[2]*(1.5+.7*p);
const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,244,205,'+(.45+.4*p)+')');g.addColorStop(.5,'rgba(255,226,150,'+(.25*p+.1)+')');g.addColorStop(1,'rgba(255,220,140,0)');
c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();});
for(const b of bok){const y=((b.y-t*b.vy)%(H+120)+(H+120))%(H+120)-60,x=b.x+Math.sin(t*b.sp+b.ph)*b.am;
const al=b.al*(.65+.35*Math.sin(t*b.sp*1.7+b.ph));const g=c.createRadialGradient(x,y,0,x,y,b.r);
g.addColorStop(0,'rgba(255,238,200,'+al+')');g.addColorStop(.7,'rgba(255,230,175,'+al*.6+')');g.addColorStop(1,'rgba(255,225,160,0)');
c.fillStyle=g;c.beginPath();c.arc(x,y,b.r,0,6.283);c.fill();}
for(const s of spk){const y=((s.y-t*s.vy)%H+H)%H,al=.25+.75*Math.abs(Math.sin(t*s.sp+s.ph));
c.fillStyle='rgba(255,243,210,'+al+')';c.beginPath();c.arc(s.x,y,s.r,0,6.283);c.fill();}
const i=Math.min(N-1,Math.floor(t/D)),lt=t-i*D,sl=slots[i];
const a=Math.max(0,Math.min(1,lt/.25,(D-lt)/.35));
if(sl.img){c.save();c.globalAlpha=a;c.translate(341,313);c.rotate(-.148);c.beginPath();c.rect(-125,-125,250,250);c.clip();
const z=1+.05*lt/D,iw=sl.img.width,ih=sl.img.height,k=Math.max(250/iw,250/ih)*z;
c.drawImage(sl.img,-iw*k/2,-ih*k/2,iw*k,ih*k);c.restore();}
c.globalAlpha=a;c.textAlign='left';c.fillStyle='#0a2a5c';
let fs=64;c.font=fs+"px "+FONT;const t1=l1.value.toUpperCase();let w1=c.measureText(t1).width;
if(w1>595){fs=fs*595/w1}c.font=fs+"px "+FONT;c.fillText(t1,645,313);
const nm=sl.name.toUpperCase();
if(nm){fs=92;c.font=fs+"px "+FONT;let fw=c.measureText(nm).width;if(fw>600){fs=Math.floor(fs*600/fw);c.font=fs+"px "+FONT;fw=c.measureText(nm).width}
const tt=Math.max(0,lt-.25),per=Math.min(.09,.9/nm.length),n=Math.min(nm.length,Math.floor(tt/per));
c.fillText(nm.slice(0,n),645,405);
if(n<nm.length||Math.floor(lt*3)%2==0){const pw=c.measureText(nm.slice(0,n)).width;c.fillRect(645+pw+4,405-fs*.7,3,fs*.72)}}
c.globalAlpha=1;}
// UI
const pv=document.getElementById('pv'),pc=pv.getContext('2d'),sk=document.getElementById('sk');
const l1=document.getElementById('l1');
let t=0,playing=false,last=0,exporting=false;
const grid=document.getElementById('grid');
function build(){grid.innerHTML='';slots.forEach((s,i)=>{const d=document.createElement('div');d.className='card';d.id='c'+i;
d.innerHTML='<div class="th">'+(s.url?'':'+ Gambar '+(i+1))+'</div><input type="text" placeholder="Nama '+(i+1)+'">';
const th=d.firstChild,ip=d.lastChild;ip.value=s.name;if(s.url)th.style.backgroundImage='url('+s.url+')';
const f=document.createElement('input');f.type='file';f.accept='image/*';f.hidden=true;d.appendChild(f);
th.onclick=()=>{t=i*D+1.3;sk.value=t;if(!s.img)f.click();else{}};
th.ondblclick=()=>f.click();
f.onchange=()=>{if(f.files[0])setImg(i,f.files[0])};
ip.oninput=()=>{s.name=ip.value;t=i*D+1.6;sk.value=t};ip.onfocus=()=>{t=i*D+1.6;sk.value=t};
grid.appendChild(d)})}
function setImg(i,file){const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{slots[i].img=im;slots[i].url=u;
const th=document.querySelector('#c'+i+' .th');th.style.backgroundImage='url('+u+')';th.textContent='';t=i*D+1.3;sk.value=t};im.src=u}
document.getElementById('bulk').onchange=e=>{let j=0;for(const f of e.target.files){while(j<N&&slots[j].img)j++;if(j>=N)break;setImg(j,f);j++}};
document.getElementById('play').onclick=function(){playing=!playing;if(playing&&t>=TOT)t=0;last=performance.now();this.textContent=playing?'⏸ Jeda':'▶ Main'};
sk.oninput=()=>{t=+sk.value};
function loop(now){if(!exporting){if(playing){t+=(now-last)/1000;if(t>=TOT){t=TOT-.001;playing=false;document.getElementById('play').textContent='▶ Main'}sk.value=t}
last=now;draw(pc,1,t);document.getElementById('tm').textContent=t.toFixed(1)+' / 50s';
document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('on',i==Math.min(N-1,Math.floor(t/D))))}
requestAnimationFrame(loop)}
bg.onload=()=>{bgc.getContext('2d').drawImage(bg,0,0,W,H);patch(630,240,640,92,168,80);patch(630,335,640,100,168,80);build();requestAnimationFrame(loop)};
bg.src=BG_SRC;
// export
const st=document.getElementById('st');
document.getElementById('save').onclick=async()=>{if(exporting)return;
const ex=document.getElementById('ex'),ec=ex.getContext('2d');
const types=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
const mt=types.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x));
if(!mt){st.textContent='Pelayar tidak menyokong rakaman video.';return}
exporting=true;playing=false;document.getElementById('play').textContent='▶ Main';
const rec=new MediaRecorder(ex.captureStream(30),{mimeType:mt,videoBitsPerSecond:14e6}),ch=[];
rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec.onstop=()=>{const ext=mt.includes('mp4')?'mp4':'webm';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:mt}));
a.download='ar-razzi-barisan-staf-2026.'+ext;a.click();st.textContent=ext=='mp4'?'Siap! MP4 HD disimpan.':'Siap (format WebM kerana pelayar tidak sokong MP4; guna Chrome/Safari terkini untuk MP4).';exporting=false};
rec.start();const t0=performance.now();
const step=now=>{const e=(now-t0)/1000;if(e>=TOT){draw(ec,1.5,TOT-.001);setTimeout(()=>rec.stop(),300);return}
draw(ec,1.5,e);st.textContent='Merakam '+Math.round(e/TOT*100)+'% – jangan tutup/tukar tab';requestAnimationFrame(step)};
requestAnimationFrame(step)};
</script></body></html>
